services:
    laravel12_php-fpm:
        image: php:8.4-fpm-alpine
        build:
            dockerfile: docker/php-fpm/Dockerfile
        container_name: 'laravel12_php'
        ports:
            - '9000:9000'
        environment:
            WWWUSER: '${WWWUSER}'
        volumes:
            - ./:/app
        working_dir: /app
        networks:
            - net

    laravel12_nginx:
        image: nginx
        container_name: 'laravel12_nginx'
        working_dir: /app
        ports:
            - '8080:80'
        volumes:
            - ./:/app
            - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
        networks:
            - net

    laravel12_postgres:
        image: postgres:17
        ports:
            - '5432:5432'
        container_name: 'laravel12_postgres'
        working_dir: /app
        restart: always
        environment:
            PGPASSWORD: '${DB_PASSWORD:-secret}'
            POSTGRES_DB: '${DB_DATABASE}'
            POSTGRES_USER: '${DB_USERNAME}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
        volumes:
            - dump:/app/dump
            - postgresql:/var/lib/postgresql/data
        networks:
            - net

    laravel12_redis:
        container_name: 'laravel12_redis'
        image: redis:alpine
        ports:
            - '6379:6379'
        networks:
            - net

    laravel12_elasticsearch:
        image: elastic/elasticsearch:7.9.2
        container_name: 'laravel12_elasticsearch'
        environment:
            - cluster.name=docker-cluster
            - bootstrap.memory_lock=true
            - discovery.type=single-node
            - 'ES_JAVA_OPTS=-Xms512m -Xmx512m'
        ulimits:
            memlock:
                soft: -1
                hard: -1
        ports:
            - '9200:9200'
            - '9300:9300'
        volumes:
            - elasticsearch:/usr/share/elasticsearch/data
        networks:
            - net

    laravel12_kibana:
        image: elastic/kibana:7.9.2
        container_name: 'laravel12_kibana'
        depends_on:
            - laravel12_elasticsearch
        environment:
            SERVER_NAME: laravel12_kibana
            ELASTICSEARCH_HOSTS: http://laravel12_elasticsearch:9200
        links:
            - laravel12_elasticsearch
        ports:
            - '5601:5601'
        networks:
            - net

    laravel12_influxdb:
        image: influxdb:2.7
        container_name: laravel12_influxdb
        ports:
            - '${INFLUXDB_PORT:-8086}:8086'
        environment:
            DOCKER_INFLUXDB_INIT_MODE: setup
            DOCKER_INFLUXDB_INIT_USERNAME: admin
            DOCKER_INFLUXDB_INIT_PASSWORD: password
            DOCKER_INFLUXDB_INIT_ORG: myorg
            DOCKER_INFLUXDB_INIT_BUCKET: default
        volumes:
            - influxdb-data:/var/lib/influxdb2
        networks:
            - net

    laravel12_grafana:
        image: grafana/grafana
        container_name: laravel12_grafana
        ports:
            - '${GRAFANA_PORT:-3000}:3000'
        volumes:
            - grafana-data:/var/lib/grafana
        environment:
            - GF_SECURITY_ADMIN_USER=admin
            - GF_SECURITY_ADMIN_PASSWORD=password
        depends_on:
            - laravel12_influxdb
        networks:
            - net

#Docker Networks
networks:
    net:
        driver: bridge

#Docker Volumes
volumes:
    dump:
    postgresql:
    elasticsearch:
        driver: local
    influxdb-data:
        driver: local
    grafana-data:
        driver: local
