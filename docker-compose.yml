services:
    laravel12_php-fpm:
        image: php:8.4-fpm-alpine
        build:
            dockerfile: docker/php-fpm/Dockerfile
        container_name: 'laravel12_php'
        ports:
            - '9000:9000'
        environment:
            WWWUSER: '${WWWUSER}'
        volumes:
            - ./:/app
        working_dir: /app
        networks:
            - net

    laravel12_nginx:
        image: nginx
        container_name: 'laravel12_nginx'
        working_dir: /app
        ports:
            - '8080:80'
        volumes:
            - ./:/app
            - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
        networks:
            - net

    laravel12_postgres:
        image: postgres:17
        ports:
            - 5432:5432
        container_name: 'laravel12_postgres'
        working_dir: /app
        restart: always
        environment:
            PGPASSWORD: '${DB_PASSWORD:-secret}'
            POSTGRES_DB: '${DB_DATABASE}'
            POSTGRES_USER: '${DB_USERNAME}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
        volumes:
            - dump:/app/dump
            - postgresql:/var/lib/postgresql/data
        networks:
            - net

    laravel12_redis:
        container_name: 'laravel12_redis'
        image: redis:alpine
        ports:
            - 6379:6379
        networks:
            - net

#Docker Networks
networks:
    net:
        driver: bridge

#Docker Volumes
volumes:
    dump:
    postgresql:
